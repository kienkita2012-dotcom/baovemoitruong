<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liên hệ tác giả | Environmental Protection</title>
    <link rel="icon" type="image/png" href="logobaovemoitruong.png" />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        color: #064e3b;
        overflow-x: hidden;
        position: relative;
      }

      /* ===== FOREST BACKGROUND ===== */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background:
          linear-gradient(rgba(240, 253, 244, 0.92), rgba(240, 253, 244, 0.92)),
          url("images/forest-bg.jpg");
        background-size: cover;
        background-position: center;
        z-index: -3;
      }

      /* ===== HEADER ===== */
      header {
        background: linear-gradient(135deg, #22c55e, #15803d);
        color: white;
        text-align: center;
        padding: 25px 15px;
        border-radius: 0 0 22px 22px;
        animation: slideDown 0.8s ease;
      }

      header h1 {
        font-size: 28px;
      }

      .lang-switch {
        margin-top: 12px;
      }

      .lang-switch button {
        padding: 6px 16px;
        border-radius: 20px;
        border: none;
        font-weight: bold;
        cursor: pointer;
        margin: 0 6px;
        background: #ecfdf5;
        color: #065f46;
        transition: 0.3s;
      }

      .lang-switch button:hover {
        background: #a7f3d0;
        transform: scale(1.05);
      }

      /* ===== MAIN ===== */
      main {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px 20px;
      }

      .contact-card {
        position: relative;
        max-width: 900px;
        width: 100%;
        background: white;
        border-radius: 22px;
        padding: 45px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
        animation: fadeInUp 0.9s ease forwards;
        overflow: hidden;
        backdrop-filter: blur(2px);
      }

      /* ===== LEAF WATERMARK ===== */
      .contact-card::before {
        content: "🍃";
        position: absolute;
        font-size: 240px;
        opacity: 0.06;
        top: -60px;
        right: -80px;
        transform: rotate(-20deg);
      }

      .contact-card::after {
        content: "🌿";
        position: absolute;
        font-size: 200px;
        opacity: 0.06;
        bottom: -60px;
        left: -60px;
        transform: rotate(15deg);
      }

      .author-layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 40px;
        align-items: center;
      }

      /* ===== AUTHOR IMAGE ===== */
      .author-image {
        position: relative;
        padding: 8px;
        border-radius: 50%;
        background: radial-gradient(
          circle at top left,
          #a7f3d0,
          #22c55e,
          #15803d
        );
        transition: 0.4s;
      }

      .author-image::before {
        content: "🌿";
        position: absolute;
        top: -12px;
        left: 12px;
        font-size: 22px;
      }

      .author-image::after {
        content: "🍃";
        position: absolute;
        bottom: -12px;
        right: 12px;
        font-size: 20px;
      }

      .author-image img {
        width: 180px;
        height: 180px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid white;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.3);
        transition: 0.4s;
      }

      .author-image:hover img {
        transform: scale(1.12) rotate(1deg);
      }

      /* ===== AUTHOR INFO ===== */
      .author-info {
        border-left: 2px dashed #bbf7d0;
        padding-left: 25px;
      }

      .author-info h2 {
        color: #15803d;
        margin-bottom: 15px;
      }

      .author-info p {
        font-size: 18px;
        margin: 8px 0;
        line-height: 1.6;
      }

      .back-home {
        text-align: center;
        margin-top: 30px;
      }

      .back-home a {
        padding: 12px 28px;
        border-radius: 25px;
        background: linear-gradient(135deg, #22c55e, #15803d);
        color: white;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
      }

      .back-home a:hover {
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      }

      /* ===== FOOTER ===== */
      footer {
        background: #15803d;
        color: white;
        text-align: center;
        padding: 15px;
        border-radius: 22px 22px 0 0;
      }

      /* ===== WIND LEAVES ===== */
      .leaf {
        position: fixed;
        top: -50px;
        font-size: 22px;
        opacity: 0.7;
        pointer-events: none;
        animation: windFall linear;
        z-index: 999;
      }

      @keyframes windFall {
        0% {
          transform: translateX(0) translateY(0) rotate(0deg);
        }
        50% {
          transform: translateX(90px) translateY(55vh) rotate(180deg);
        }
        100% {
          transform: translateX(180px) translateY(110vh) rotate(360deg);
        }
      }

      /* ===== ANIM ===== */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ===== MOBILE ===== */
      @media (max-width: 600px) {
        .author-layout {
          grid-template-columns: 1fr;
          text-align: center;
        }

        .author-info {
          border-left: none;
          padding-left: 0;
        }

        .author-image img {
          width: 140px;
          height: 140px;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <h1 data-vi="📩 Liên hệ tác giả" data-en="📩 Contact the Author"></h1>
      <div class="lang-switch">
        <button onclick="setLang('vi')">VI</button>
        <button onclick="setLang('en')">EN</button>
      </div>
    </header>

    <main>
      <div class="contact-card">
        <div class="author-layout">
          <div class="author-image">
            <img src="author.jpg" alt="Author" />
          </div>

          <div class="author-info">
            <h2 data-vi="Thông tin tác giả" data-en="Author Information"></h2>
            <p
              data-vi="👤 Họ tên: Nguyễn Trung Kiên"
              data-en="👤 Name: Nguyen Trung Kien"
            ></p>
            <p data-vi="🎓 Lớp: 8/5" data-en="🎓 Class: 8/5"></p>
            <p
              data-vi="🏫 Trường: THPT Hùng Vương"
              data-en="🏫 School: Hùng Vương High School"
            ></p>
            <p
              data-vi="📧 Email: kienkita.2012@gmail.com"
              data-en="📧 Email: kienkita.2012@gmail.com"
            ></p>
            <p
              data-vi="🌱 Chung tay bảo vệ môi trường từ hôm nay!"
              data-en="🌱 Join hands to protect the environment today!"
            ></p>
          </div>
        </div>

        <div class="back-home">
          <a
            href="trangchu.html"
            data-vi="⬅ Quay lại Trang chủ"
            data-en="⬅ Back to Home"
          ></a>
        </div>
      </div>
    </main>

    <footer>© 2026 | Environmental Protection 🌍</footer>

    <script>
      function setLang(lang) {
        localStorage.setItem("lang", lang);
        document.querySelectorAll("[data-vi]").forEach((el) => {
          el.innerText = el.getAttribute("data-" + lang);
        });
      }

      window.addEventListener("DOMContentLoaded", () => {
        setLang(localStorage.getItem("lang") || "vi");
      });

      /* Wind leaves */
      function createLeaf() {
        const leaf = document.createElement("div");
        leaf.className = "leaf";
        leaf.innerHTML = ["🍃", "🌿", "🍂"][Math.floor(Math.random() * 3)];
        leaf.style.left = Math.random() * 100 + "vw";
        leaf.style.animationDuration = 9 + Math.random() * 6 + "s";
        leaf.style.fontSize = 18 + Math.random() * 14 + "px";
        document.body.appendChild(leaf);
        setTimeout(() => leaf.remove(), 16000);
      }
      setInterval(createLeaf, 1500);
    </script>
  </body>
</html>
